version: "2"

linters:
  enable:
    - bodyclose
    - errorlint
    - misspell
    - noctx
    - unconvert
  exclusions:
    paths:
      - statik
      - plum-frontend
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (*os.Process).Kill
