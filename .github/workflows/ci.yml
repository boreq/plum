name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  check-backend:
    name: Check backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26
          cache-dependency-path: plum-backend/go.sum

      - name: Run tests
        run: make ci-backend

  check-frontend:
    name: Check frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plum-frontend
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Run CI
        run: make ci

  build-release-binary:
    name: Build release binary
    runs-on: ubuntu-latest
    needs: [check-backend, check-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:

      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26
          cache-dependency-path: plum-backend/go.sum

      - name: Build frontend
        run: make frontend

      - name: Build release binary
        run: make build

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: plum-linux-amd64
          path: plum-backend/build/plum
          if-no-files-found: error
